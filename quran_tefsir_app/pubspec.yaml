name: quran_tefsir_app
description: "ሱራ አል በቀራ በኡስታዝ ባህሩ ተካ"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.0.0  # ኦዲዮ ለማጫወት

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/beqera.jpg
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  # አሴቶችን (Assets) ማስመዝገብ
  assets:
    - assets/images/beqera.jpg
    - assets/images/quran.jpg
    - assets/audio/
    